<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Letter for You</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <h1>To My Dearest,</h1>
                        <p>Happy Valentine's Day! My life is so much brighter with you in it. Thank you for being who you are...</p>
                        <p style="margin-top: 10px; font-weight: 600;">Yours truly, ❤️</p>
                    </div>
                </div>
                <div class="front"></div>
            </div>
            <div class="heart"></div>
        </div>
        
        <button id="mainButton" class="btn-premium">Open This Letter</button>
        
        <div id="messageOverlay" class="overlay hidden">
            <div class="message-card">
                <h2 id="valentineText"></h2>
                <div class="hearts-container" id="heartsContainer"></div>
                <button id="closeButton" class="btn-close">Close</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
